<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sinuca Online — Bola 8 para dois jogadores</title>
  <meta name="description" content="Jogo de sinuca (bola 8) para dois jogadores. Crie uma sala, envie o link e jogue com um amigo direto no navegador." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">🎱 Sinuca Online</div>
    <div id="room-chip" class="hidden">
      <span>Sala <strong id="room-code"></strong></span>
      <button id="btn-copy" class="small">Copiar link</button>
      <button id="btn-leave" class="small danger">Sair</button>
    </div>
  </header>

  <main>
    <div id="hud" class="hidden">
      <div class="player-card" id="card-0">
        <div class="p-name" id="name-0"></div>
        <div class="p-group" id="group-0"></div>
        <div class="p-balls" id="balls-0"></div>
      </div>
      <div id="center-info">
        <div id="msg"></div>
        <div id="hint"></div>
      </div>
      <div class="player-card" id="card-1">
        <div class="p-name" id="name-1"></div>
        <div class="p-group" id="group-1"></div>
        <div class="p-balls" id="balls-1"></div>
      </div>
    </div>

    <div id="table-wrap">
      <canvas id="table"></canvas>
    </div>
  </main>

  <div id="menu" class="overlay">
    <div class="dialog" id="panel-main">
      <h1>🎱 Sinuca Online</h1>
      <p class="sub">Bola 8 para dois jogadores. Crie uma sala, envie o link e jogue com um amigo — direto no navegador, sem cadastro.</p>
      <label class="field">
        Seu nome
        <input id="inp-name" maxlength="14" placeholder="Jogador" autocomplete="nickname" />
      </label>
      <button id="btn-create" class="primary big">Criar sala</button>
      <div class="join-row">
        <input id="inp-code" maxlength="5" placeholder="CÓDIGO" autocapitalize="characters" autocomplete="off" spellcheck="false" />
        <button id="btn-join">Entrar na sala</button>
      </div>
      <button id="btn-local" class="ghost">Jogar em dois no mesmo aparelho</button>
      <p id="net-status"></p>
    </div>

    <div class="dialog hidden" id="panel-wait">
      <h2>Sala criada!</h2>
      <p class="sub">Envie o código ou o link para o seu amigo:</p>
      <div class="big-code" id="wait-code"></div>
      <button id="btn-copy-wait" class="primary big">Copiar link de convite</button>
      <p id="wait-status" class="pulse">Aguardando seu amigo entrar…</p>
      <button id="btn-cancel-wait" class="ghost">Cancelar</button>
    </div>
  </div>

  <div id="end" class="overlay hidden">
    <div class="dialog">
      <h2 id="end-msg"></h2>
      <button id="btn-rematch" class="primary big">Revanche</button>
      <button id="btn-menu" class="ghost">Voltar ao menu</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
