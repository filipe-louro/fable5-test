<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hub de Jogos — 10 jogos P2P para dois jogadores</title>
  <meta name="description" content="Hub de jogos para dois jogadores + espectadores: sinuca, futebol de botão, ping pong, air hockey, boliche, mini-golf, pinball, poker, damas e jogo da velha. Modo casual ou torneio com placar. Direto no navegador, sem cadastro." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">🕹️ Hub de Jogos</div>
    <div id="room-chip" class="hidden">
      <span>Sala <strong id="room-code"></strong></span>
      <span id="spec-chip" class="hidden" title="Espectadores">👁 <span id="spec-n">0</span></span>
      <button id="btn-copy" class="small">Copiar link</button>
      <button id="btn-leave" class="small danger">Sair</button>
    </div>
  </header>

  <main>
    <!-- MENU -->
    <section id="menu">
      <div class="dialog">
        <h1>🕹️ Hub de Jogos</h1>
        <p class="sub">10 jogos para dois jogadores + espectadores, direto no navegador.
          Crie uma sala, chame um amigo e escolham juntos: partida casual ou torneio com placar.</p>
        <label class="field">
          Seu nome
          <input id="inp-name" maxlength="14" placeholder="Jogador" autocomplete="nickname" />
        </label>
        <button id="btn-create" class="primary big">Criar sala</button>
        <div class="join-row">
          <input id="inp-code" maxlength="5" placeholder="CÓDIGO" autocapitalize="characters" autocomplete="off" spellcheck="false" />
          <button id="btn-join">Entrar na sala</button>
        </div>
        <button id="btn-local" class="ghost">Jogar em dois no mesmo aparelho</button>
        <p id="net-status"></p>
      </div>

      <div class="dialog rooms-panel">
        <h2>Salas ativas</h2>
        <div class="rooms-tools">
          <input id="rooms-filter" placeholder="Filtrar por código, anfitrião, jogo…" />
          <select id="rooms-kind">
            <option value="all">Todas</option>
            <option value="lobby">Com vaga</option>
            <option value="playing">Jogando</option>
          </select>
          <button id="btn-refresh-rooms" class="small">Atualizar</button>
        </div>
        <div id="rooms-list"></div>
        <p id="rooms-status" class="muted">—</p>
      </div>
    </section>

    <!-- LOBBY -->
    <section id="lobby" class="hidden">
      <div class="dialog lobby-dialog">
        <div class="lobby-head">
          <div>
            <h2>Sala <span id="lobby-code" class="code"></span></h2>
            <div id="lobby-players"></div>
            <div id="lobby-spec" class="muted"></div>
          </div>
          <div class="lobby-head-btns">
            <button id="btn-copy-lobby" class="small">Copiar convite</button>
            <button id="btn-leave-lobby" class="small danger">Sair</button>
          </div>
        </div>

        <div class="mode-row">
          <button id="btn-mode-casual" class="mode-btn">🎲 Casual<small>uma partida de um jogo</small></button>
          <button id="btn-mode-torneio" class="mode-btn">🏆 Torneio<small>vários jogos, placar de vitórias</small></button>
        </div>

        <div id="games-grid"></div>

        <label id="lobby-public-row" class="check-row">
          <input type="checkbox" id="chk-public" checked />
          Listar esta sala publicamente em "Salas ativas"
        </label>

        <p id="lobby-hint" class="muted"></p>
        <button id="btn-start" class="primary big">Começar!</button>
      </div>
    </section>

    <!-- JOGO -->
    <section id="game" class="hidden">
      <div id="game-top">
        <div id="tourney" class="hidden"></div>
        <button id="btn-abort" class="small danger hidden">⏹ Encerrar partida</button>
      </div>
      <div id="hud">
        <div class="player-card" id="card-0">
          <div class="p-name" id="name-0"></div>
          <div class="p-sub" id="sub-0"></div>
        </div>
        <div id="center-info">
          <div id="msg"></div>
          <div id="hint"></div>
        </div>
        <div class="player-card" id="card-1">
          <div class="p-name" id="name-1"></div>
          <div class="p-sub" id="sub-1"></div>
        </div>
      </div>
      <div id="table-wrap">
        <canvas id="table"></canvas>
      </div>
      <div id="actions" class="hidden"></div>
    </section>
  </main>

  <!-- Fim de partida (interstitial) -->
  <div id="inter" class="overlay hidden">
    <div class="dialog">
      <h2 id="inter-title"></h2>
      <div id="inter-board"></div>
      <div id="inter-btns" class="btn-col"></div>
    </div>
  </div>

  <!-- Campeão do torneio -->
  <div id="final" class="overlay hidden">
    <div class="dialog">
      <h2 id="final-title"></h2>
      <div id="final-board"></div>
      <div id="final-btns" class="btn-col"></div>
    </div>
  </div>

  <!-- Desconexão / fim -->
  <div id="end" class="overlay hidden">
    <div class="dialog">
      <h2 id="end-msg"></h2>
      <button id="btn-end-menu" class="primary big">Voltar ao menu</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
